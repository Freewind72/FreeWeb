<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeWeb - 精致导航</title>
    <style>
        /* ===== 全局变量 ===== */
        :root {
            --bg-color: #0a0a0f;
            --bg-gradient: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #0a0a0f 100%);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --card-hover-bg: rgba(255, 255, 255, 0.08);
            --accent-color: #6366f1;
            --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --glow-color: rgba(99, 102, 241, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== 亮色主题 ===== */
        body.light-theme {
            --bg-color: #f5f7fa;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 50%, #f5f7fa 100%);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.5);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --card-hover-bg: rgba(255, 255, 255, 0.9);
            --glow-color: rgba(99, 102, 241, 0.2);
        }

        /* ===== 基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-color);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            transition: var(--transition);
        }

        /* ===== 背景动画 ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--accent-gradient);
            opacity: 0.03;
            animation: float 20s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 200px;
            height: 200px;
            top: 60%;
            right: 10%;
            animation-delay: -5s;
        }

        .shape-3 {
            width: 250px;
            height: 250px;
            bottom: 10%;
            left: 30%;
            animation-delay: -10s;
        }

        .shape-4 {
            width: 180px;
            height: 180px;
            top: 30%;
            right: 30%;
            animation-delay: -15s;
        }

        .shape-5 {
            width: 220px;
            height: 220px;
            top: 80%;
            right: 20%;
            animation-delay: -8s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            33% { transform: translateY(-30px) rotate(120deg) scale(1.05); }
            66% { transform: translateY(20px) rotate(240deg) scale(0.95); }
        }

        .gradient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: orb-float 15s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-color);
            opacity: 0.15;
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: #a855f7;
            opacity: 0.1;
            bottom: -50px;
            right: -50px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: #ec4899;
            opacity: 0.08;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes orb-float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 30px) scale(1.1); }
        }

        /* ===== 玻璃态效果 ===== */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
        }

        /* ===== 头部 ===== */
        .glass-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 0;
            transition: var(--transition);
        }

        .glass-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            z-index: -1;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: logo-shimmer 3s ease-in-out infinite;
        }

        @keyframes logo-shimmer {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2); }
        }

        .logo-icon {
            font-size: 32px;
            animation: rotate-logo 10s linear infinite;
        }

        @keyframes rotate-logo {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            text-decoration: none;
        }

        .icon-btn:hover {
            background: var(--card-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--glow-color);
        }

        .theme-toggle .moon-icon {
            display: none;
        }

        body.light-theme .theme-toggle .sun-icon {
            display: none;
        }

        body.light-theme .theme-toggle .moon-icon {
            display: block;
        }

        /* ===== 搜索框 ===== */
        .search-section {
            padding-top: 120px;
            padding-bottom: 40px;
            text-align: center;
        }

        .search-box {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 24px;
            border-radius: 50px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .search-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--accent-gradient);
            opacity: 0;
            transition: var(--transition);
            z-index: -1;
        }

        .search-box:focus-within::before {
            opacity: 0.1;
        }

        .search-box:focus-within {
            box-shadow: 0 0 40px var(--glow-color);
            border-color: var(--accent-color);
        }

        .search-icon {
            flex-shrink: 0;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .search-box:focus-within .search-icon {
            color: var(--accent-color);
            animation: icon-pulse 1s ease-in-out infinite;
        }

        @keyframes icon-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            color: var(--text-primary);
            outline: none;
            width: 100%;
        }

        .search-box input::placeholder {
            color: var(--text-secondary);
        }

        /* ===== 分类筛选 ===== */
        .category-filter-wrapper {
            text-align: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }
        
        .category-filter {
            display: inline-flex;
            gap: 12px;
            padding: 20px 30px;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
            flex-wrap: wrap;
            justify-content: center;
            overflow-x: visible;
            -ms-overflow-style: none;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        
        .scroll-indicator {
            display: none; /* 默认隐藏，只在移动端且内容溢出时显示 */
            position: absolute;
            right: 0px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            color: var(--text-secondary);
            z-index: 20;
            white-space: nowrap;
            opacity: 0.7;
        }

        .filter-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
            animation: fade-in-up 0.5s ease-out forwards;
            opacity: 0;
        }

        .filter-btn:nth-child(1) { animation-delay: 0.1s; }
        .filter-btn:nth-child(2) { animation-delay: 0.15s; }
        .filter-btn:nth-child(3) { animation-delay: 0.2s; }
        .filter-btn:nth-child(4) { animation-delay: 0.25s; }
        .filter-btn:nth-child(5) { animation-delay: 0.3s; }

        @keyframes fade-in-up {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .filter-btn:hover {
            background: var(--card-hover-bg);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px var(--glow-color);
        }

        .filter-btn.active {
            background: var(--accent-gradient);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 4px 20px var(--glow-color);
        }

        .filter-btn i {
            font-size: 18px;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        /* ===== 主内容 ===== */
        .main-content {
            position: relative;
            z-index: 1;
            min-height: calc(100vh - 350px);
            padding: 20px 30px 80px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .category-section {
            margin-bottom: 50px;
            animation: fade-in-up 0.6s ease-out forwards;
            opacity: 0;
        }

        .category-section:nth-child(1) { animation-delay: 0.2s; }
        .category-section:nth-child(2) { animation-delay: 0.3s; }
        .category-section:nth-child(3) { animation-delay: 0.4s; }
        .category-section:nth-child(4) { animation-delay: 0.5s; }
        .category-section:nth-child(5) { animation-delay: 0.6s; }

        .category-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--glass-border);
            position: relative;
        }

        .category-title::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 60px;
            height: 2px;
            background: var(--accent-gradient);
            animation: expand-line 0.5s ease-out forwards;
        }

        @keyframes expand-line {
            from { width: 0; }
            to { width: 60px; }
        }

        .category-title i {
            font-size: 28px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .websites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .website-card {
            padding: 24px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-primary);
            display: block;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .website-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .website-card:hover::before {
            left: 100%;
        }

        .website-card:hover {
            background: var(--card-hover-bg);
            transform: translateY(-5px);
            box-shadow: 0 10px 40px var(--glow-color);
            border-color: var(--accent-color);
        }

        .website-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 16px;
            position: relative;
        }

        .website-icon::after {
            content: '';
            position: absolute;
            inset: -2px;
            background: var(--accent-gradient);
            border-radius: 14px;
            z-index: -1;
            opacity: 0;
            transition: var(--transition);
        }

        .website-card:hover .website-icon::after {
            opacity: 0.3;
            animation: icon-glow 1.5s ease-in-out infinite;
        }

        @keyframes icon-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.05); }
        }

        .website-icon i,
        .website-icon span {
            color: #ffffff;
            font-size: 24px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .website-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .website-desc {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ===== 加载动画 ===== */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 300px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--glass-border);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== 页脚 ===== */
        .glass-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 15px;
            text-align: center;
            z-index: 100;
        }

        .glass-footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            z-index: -1;
        }

        .glass-footer p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ===== 隐藏类 ===== */
        .hidden {
            display: none !important;
        }

        /* PC端样式：保持居中换行布局 */
        @media (min-width: 769px) {
            .category-filter {
                justify-content: center;
                overflow-x: visible;
                flex-wrap: wrap;
            }
            
            .scroll-indicator {
                display: none !important;
            }
        }
        
        /* ===== 响应式设计 ===== */
        @media (max-width: 768px) {
            .header-content {
                padding: 0 20px;
            }

            .logo-text {
                font-size: 24px;
            }

            .search-section {
                padding-top: 100px;
            }

            .search-box {
                max-width: calc(100% - 40px);
                padding: 16px 20px;
            }

            .category-filter-wrapper {
                padding: 15px 20px;
                max-width: calc(100% - 40px);
                margin: 0 auto;
            }

            .category-filter {
                justify-content: flex-start;
                overflow-x: auto;
                scroll-snap-type: x mandatory;
                -webkit-overflow-scrolling: touch;
                flex-wrap: nowrap;
                max-width: 100%;
                scrollbar-width: none;
            }
            
            .category-filter::-webkit-scrollbar {
                display: none;
            }

            .scroll-indicator {
                display: block !important;
                position: absolute;
                right: 20px;
                top: 50%;
                transform: translateY(-50%);
                background: var(--glass-bg);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                border: 1px solid var(--glass-border);
                border-radius: 20px;
                padding: 4px 12px;
                font-size: 11px;
                color: var(--text-secondary);
                z-index: 1000;
                white-space: nowrap;
                opacity: 0.7;
                pointer-events: none;
            }

            .filter-btn {
                padding: 10px 16px;
                font-size: 13px;
                scroll-snap-align: start;
                flex-shrink: 0;
                min-width: fit-content;
                margin-right: 8px;
            }

            .main-content {
                padding: 15px 20px 80px;
            }

            .category-title {
                font-size: 20px;
            }

            .websites-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 15px;
            }

            .website-card {
                padding: 20px;
            }

            .website-icon {
                width: 42px;
                height: 42px;
            }

            .website-icon i,
            .website-icon span {
                font-size: 22px;
                width: 22px;
                height: 22px;
            }

            .website-name {
                font-size: 16px;
            }

            .website-desc {
                font-size: 13px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                font-size: 24px;
            }

            .logo-icon {
                font-size: 28px;
            }

            .icon-btn {
                width: 40px;
                height: 40px;
            }

            .search-box {
                padding: 14px 18px;
            }

            .search-box input {
                font-size: 15px;
            }

            .category-filter {
                gap: 8px;
                padding: 15px 5px;
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            
            .filter-btn {
                padding: 8px 12px;
                font-size: 11px;
                min-width: auto;
                flex-shrink: 0;
            }

            .websites-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .category-section {
                margin-bottom: 35px;
            }
        }
        
        /* 针对极小屏幕的分类按钮优化 */
        @media (max-width: 360px) {
            .filter-btn {
                padding: 7px 10px;
                font-size: 10px;
                min-width: auto;
                flex-shrink: 0;
            }
            
            .category-filter {
                padding: 15px 2px;
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
        
        /* ===== 滚动条样式 ===== */
        /* 隐藏分类筛选容器的滚动条 */
        .category-filter::-webkit-scrollbar {
            display: none;
        }
        
        /* 确保PC端分类筛选器保持正确的布局 */
        @media (min-width: 769px) {
            .category-filter {
                justify-content: center !important;
                overflow-x: visible !important;
                flex-wrap: wrap !important;
            }
        }

        /* ===== 滚动条样式 ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }
    </style>
</head>
<body class="dark-theme">
    <!-- 背景动画 -->
    <div class="bg-animation">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- 头部 -->
    <header class="glass-header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">❖</span>
                <span class="logo-text">FreeWeb</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn theme-toggle" title="切换主题">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <a href="admin/" class="icon-btn" title="后台管理">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- 搜索框 -->
    <div class="search-section">
        <div class="search-box glass-card">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="搜索网站..." autocomplete="off">
        </div>
    </div>

    <!-- 分类筛选按钮 -->
    <div class="category-filter-wrapper">
        <div class="category-filter">
            <button class="filter-btn active" data-category="all">
                <i class="iconfont"> &#xe6e0; </i>
                <span>全部</span>
            </button>
        </div>
    </div>

    <!-- 主内容 -->
    <main class="main-content">
        <div class="loading-spinner">
            <div class="spinner"></div>
        </div>
        <div class="container" id="container" style="display: none;"></div>
    </main>

    <!-- 页脚 -->
    <footer class="glass-footer">
        <p>&copy; 2024 FreeWeb. Made with ❤️</p>
    </footer>

    <script>
        // 全局变量
        let allData = [];
        let currentCategory = 'all';

        // DOM元素
        const container = document.getElementById('container');
        const loadingSpinner = document.querySelector('.loading-spinner');
        const categoryFilter = document.querySelector('.category-filter');
        const searchInput = document.getElementById('searchInput');

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            initThemeToggle();
            initSearch();
            
            // 监听窗口大小变化，调整分类按钮
            window.addEventListener('resize', () => {
                setTimeout(() => {
                    adjustCategoryButtonsForMobile();
                }, 100);
            });
            
            // 监听分类筛选器的滚动事件，滚动时隐藏指示器
            const categoryFilter = document.querySelector('.category-filter');
            if (categoryFilter) {
                categoryFilter.addEventListener('scroll', () => {
                    const indicator = document.querySelector('.scroll-indicator');
                    if (indicator) {
                        indicator.style.opacity = '0';
                        
                        // 滚动停止后重新显示指示器
                        clearTimeout(window.scrollTimeout);
                        window.scrollTimeout = setTimeout(() => {
                            indicator.style.opacity = '0.7';
                        }, 1000);
                    }
                });
            }
            
            // 确保滚动指示器存在
            setTimeout(ensureScrollIndicator, 500);
        });

        // 加载数据
        async function loadData() {
            try {
                const response = await fetch('api/get_data.php');
                const result = await response.json();
                
                if (result.code === 0) {
                    allData = result.data;
                    renderCategories(allData);
                    renderWebsites(allData);
                    
                    // 显示内容，隐藏加载动画
                    loadingSpinner.style.display = 'none';
                    container.style.display = 'block';
                } else {
                    showError(result.message);
                }
            } catch (error) {
                showError('加载数据失败，请检查网络连接');
            }
        }

        // 渲染分类筛选按钮
        function renderCategories(data) {
            // 清空所有按钮
            categoryFilter.innerHTML = '';

            // 创建"全部"按钮
            const allBtn = document.createElement('button');
            allBtn.className = 'filter-btn';
            allBtn.dataset.category = 'all';
            allBtn.innerHTML = `
                <i class="iconfont">&#xe6e0;</i>
                <span>全部</span>
            `;
            allBtn.addEventListener('click', () => filterCategory('all'));
            categoryFilter.appendChild(allBtn);

            // 添加其他分类按钮
            data.forEach(category => {
                const btn = document.createElement('button');
                btn.className = 'filter-btn';
                btn.dataset.category = category.id;
                btn.innerHTML = `
                    <i class="iconfont">${category.icon || '&#xe6e0;'}</i>
                    <span>${category.name}</span>
                `;
                btn.addEventListener('click', () => filterCategory(category.id));
                categoryFilter.appendChild(btn);
            });

            // 设置当前激活的按钮
            updateActiveButton();
            
            // 检查是否有过多的分类，移动端优化
            setTimeout(() => {
                checkCategoryOverflow();
                adjustCategoryButtonsForMobile();
            }, 100);
            
            // 确保滚动指示器存在
            ensureScrollIndicator();
        }

        // 更新激活的按钮状态
        function updateActiveButton() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.category == currentCategory) {
                    btn.classList.add('active');
                }
            });
        }

        // 渲染网站卡片
        function renderWebsites(data, filterCategory = 'all', searchTerm = '') {
            container.innerHTML = '';
            
            let filteredData = data;
            
            // 按分类筛选
            if (filterCategory !== 'all') {
                filteredData = data.filter(cat => cat.id == filterCategory);
            }
            
            // 搜索过滤
            if (searchTerm) {
                filteredData = filteredData.map(category => ({
                    ...category,
                    websites: category.websites.filter(website =>
                        website.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        website.description.toLowerCase().includes(searchTerm.toLowerCase())
                    )
                })).filter(category => category.websites.length > 0);
            }
            
            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="no-results" style="text-align: center; padding: 60px 20px; color: var(--text-secondary);">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="margin-bottom: 20px;">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <p style="font-size: 18px;">没有找到相关网站</p>
                    </div>
                `;
                return;
            }
            
            filteredData.forEach(category => {
                const section = document.createElement('div');
                section.className = 'category-section';
                section.dataset.categoryId = category.id;
                
                const title = document.createElement('h2');
                title.className = 'category-title';
                title.innerHTML = `<i class="iconfont">${category.icon || '&#xe6e0;'}</i>${category.name}`;
                
                const grid = document.createElement('div');
                grid.className = 'websites-grid';
                
                category.websites.forEach((website, index) => {
                    const card = createWebsiteCard(website, index);
                    grid.appendChild(card);
                });
                
                section.appendChild(title);
                section.appendChild(grid);
                container.appendChild(section);
            });
        }

        // 创建网站卡片
        function createWebsiteCard(website, index) {
            const card = document.createElement('a');
            card.className = 'website-card glass-card';
            card.href = website.url;
            card.target = '_blank';
            card.rel = 'noopener noreferrer';
            
            // 动画延迟
            card.style.animationDelay = `${index * 0.05}s`;
            
            card.innerHTML = `
                <div class="website-icon">
                    <span>${website.icon || '🌐'}</span>
                </div>
                <div class="website-name">${website.name}</div>
                <div class="website-desc">${website.description || '暂无描述'}</div>
            `;
            
            return card;
        }

        // 筛选分类
        function filterCategory(categoryId) {
            currentCategory = categoryId;
            updateActiveButton();
            
            // 重新渲染
            renderWebsites(allData, categoryId, searchInput.value);
            
            // 移动端优化：滚动到选中的分类按钮
            setTimeout(() => {
                const activeBtn = document.querySelector(`.filter-btn[data-category="${categoryId}"]`);
                if (activeBtn && window.innerWidth <= 768) {
                    activeBtn.scrollIntoView({
                        behavior: 'smooth',
                        block: 'nearest',
                        inline: 'center'
                    });
                }
            }, 100);
        }

        // 初始化搜索功能
        function initSearch() {
            let searchTimeout;
            
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.trim();
                
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    renderWebsites(allData, currentCategory, searchTerm);
                }, 300);
            });
        }

        // 初始化主题切换
        function initThemeToggle() {
            const themeToggle = document.querySelector('.theme-toggle');
            const savedTheme = localStorage.getItem('theme') || 'dark';
            
            // 应用保存的主题
            if (savedTheme === 'light') {
                document.body.classList.remove('dark-theme');
                document.body.classList.add('light-theme');
            }
            
            // 切换主题
            themeToggle.addEventListener('click', () => {
                document.body.classList.toggle('light-theme');
                document.body.classList.toggle('dark-theme');
                
                const currentTheme = document.body.classList.contains('light-theme') ? 'light' : 'dark';
                localStorage.setItem('theme', currentTheme);
            });
        }

        // 确保滚动指示器存在
        function ensureScrollIndicator() {
            let indicator = document.querySelector('.scroll-indicator');
            if (!indicator) {
                indicator = document.createElement('div');
                indicator.className = 'scroll-indicator';
                indicator.textContent = '← 滑动 →';
                document.querySelector('.category-filter-wrapper')?.appendChild(indicator);
            }
        }
        
        // 根据屏幕宽度和分类数量调整按钮显示
        function adjustCategoryButtonsForMobile() {
            const buttons = document.querySelectorAll('.filter-btn');
            const container = document.querySelector('.category-filter');
            
            if (!container || buttons.length === 0) return;
            
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                // 在移动设备上，确保按钮不会换行
                container.style.flexWrap = 'nowrap';
                container.style.justifyContent = 'flex-start';
                
                // 为所有按钮设置 flex-shrink 以防止压缩
                buttons.forEach(btn => {
                    btn.style.flexShrink = '0';
                });
            }
            
            // 如果分类过多，在移动端使用更紧凑的样式
            if (isMobile && buttons.length > 5) {
                buttons.forEach(btn => {
                    // 减少按钮内边距以节省空间
                    if (window.innerWidth <= 480) {
                        btn.style.padding = '8px 12px';
                        btn.style.fontSize = '12px';
                    } else {
                        btn.style.padding = '9px 14px';
                        btn.style.fontSize = '12px';
                    }
                });
            }
        }
        
        // 检查分类按钮是否溢出
        function checkCategoryOverflow() {
            const container = document.querySelector('.category-filter');
            const indicator = document.querySelector('.scroll-indicator');
            
            if (!container) return;
            
            // 检查容器是否溢出
            const isOverflowing = container.scrollWidth > container.clientWidth;
            
            if (indicator) {
                // 只在移动端且内容溢出时显示滚动指示器
                if (window.innerWidth <= 768 && isOverflowing) {
                    indicator.style.display = 'block';
                } else {
                    indicator.style.display = 'none';
                }
            }
            
            if (window.innerWidth <= 768) {
                // 在移动端上，无论是否溢出都设置为nowrap以允许滚动
                container.style.flexWrap = 'nowrap';
                container.style.justifyContent = 'flex-start';
                
                if (isOverflowing) {
                    // 如果内容溢出，启用水平滚动
                    container.style.overflowX = 'auto';
                    container.style.scrollBehavior = 'smooth';
                }
            } else {
                // 在PC端，使用换行布局
                container.style.flexWrap = 'wrap';
                container.style.justifyContent = 'center';
                container.style.overflowX = 'visible';
            }
        }
        
        // 显示错误信息
        function showError(message) {
            loadingSpinner.style.display = 'none';
            container.innerHTML = `
                <div class="error-message" style="text-align: center; padding: 60px 20px;">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" style="color: #ef4444; margin-bottom: 20px;">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <p style="font-size: 18px; color: var(--text-secondary);">${message}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
