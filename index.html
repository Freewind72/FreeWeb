<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>FreeWeb - 精致导航</title>
</head>
<body class="dark-theme">
    <!-- 背景动画 -->
    <div class="bg-animation">
        <div class="floating-shapes">
            <div class="shape shape-1"></div>
            <div class="shape shape-2"></div>
            <div class="shape shape-3"></div>
            <div class="shape shape-4"></div>
            <div class="shape shape-5"></div>
        </div>
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- 头部 -->
    <header class="glass-header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">❖</span>
                <span class="logo-text">FreeWeb</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn theme-toggle" title="切换主题">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <a href="admin/" class="icon-btn" title="后台管理">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                </a>
            </div>
        </div>
    </header>

    <!-- 搜索框 -->
    <div class="search-section">
        <div class="search-box glass-card">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="searchInput" placeholder="搜索网站..." autocomplete="off">
        </div>
    </div>

    <!-- 分类筛选按钮 -->
    <div class="category-filter-wrapper">
        <div class="category-filter">
            <button class="filter-btn active" data-category="all">
                <i class="iconfont"> &#xe6e0; </i>
                <span>全部</span>
            </button>
        </div>
    </div>

    <!-- 主内容 -->
    <main class="main-content">
        <div class="loading-spinner">
            <div class="spinner"></div>
        </div>
        <div class="container" id="container" style="display: none;"></div>
    </main>

    <!-- 页脚 -->
    <footer class="glass-footer">
        <p>&copy; 2024 FreeWeb. Made with ❤️</p>
    </footer>

    <script src="assets/js/script.js"></script>
</body>
</html>
